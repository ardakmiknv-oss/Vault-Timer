name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q vault-timer-1.21.11.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        working-directory: vault-timer
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: vault-timer-jar
          path: |
            vault-timer/build/libs/*.jar
            !vault-timer/build/libs/*-sources.jar
